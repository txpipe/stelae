[package]
name = "stelae-publisher"
description = "Stelae-owned Cardano publisher executable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stelae-publisher"
path = "src/main.rs"

[dependencies]
stelae = { path = "../stelae", version = "=0.3.1", features = ["oci"] }
stelae-cardano = { path = "../stelae-cardano", version = "=0.3.1" }

clap = { version = "4.5.37", features = ["derive"] }
# The parser Dolos reads a credentials file with, so the file means the same
# to both.
config = { version = "0.15.19", default-features = false, features = ["toml"] }
miette = { version = "7.6.0", features = ["fancy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.122"
tokio = { version = "1.47", features = ["rt", "signal"] }
tokio-util = { version = "0.7.11", features = ["rt"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
url = "2.5"

[dev-dependencies]
stelae-cardano = { path = "../stelae-cardano", version = "=0.3.1", features = ["testing"] }
tempfile = "3.20.0"
