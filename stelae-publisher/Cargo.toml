[package]
name = "stelae-publisher"
description = "Stelae-owned Cardano publisher executable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stelae-publisher"
path = "src/main.rs"

[dependencies]
stelae = { path = "../stelae", version = "=0.3.0", features = ["oci"] }
stelae-cardano = { path = "../stelae-cardano", version = "=0.3.0" }

clap = { version = "4.5.37", features = ["derive"] }
config = { version = "0.15.19", default-features = false, features = ["toml", "json"] }
miette = { version = "7.6.0", features = ["fancy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio = { version = "1.47", features = ["rt", "signal"] }
tokio-util = { version = "0.7.11", features = ["rt"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
