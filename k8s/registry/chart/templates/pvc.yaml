{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "stelae-registry.fullname" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stelae-registry.labels" . | nindent 4 }}
  annotations:
    # The metaDB is expensive to rebuild and the whole point of this volume;
    # a helm uninstall must not take it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
