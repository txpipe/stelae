# One Stelae publisher Job per network, built on the Dolos v2 configuration:
# dolosToml is a v2 file keeping full history, and the retained state epochs
# are a value of their own.
#
# These defaults are instance-agnostic — no network, registry, image pin or
# credential is assumed. Everything a network must supply is empty here and
# `required` in the templates, so a missing value fails at render rather
# than starting a half-configured publisher. The operator supplies one values
# file per network.
#
# Two values are deliberately without a default. `concurrency` was measured
# per network against the registry it writes to. `stateEpochs` is signed
# input frozen at the network's first publish. Neither may be inherited from
# a chart.

# The network name. Prefixes the Job name and labels the pod.
network: ""

# The deliberate re-run counter. The Job is named <network>-backfill-<run>,
# so bumping it makes the upgrade create a new Job and remove the old one.
# With an emptyDir the new Job restores from latest, paying the restart cost
# on purpose. With persistence it resumes the stores the last run left, so an
# image change those stores are not compatible with, or a changed repo or
# network, needs the claim deleted first. A pod template change without a bump
# fails the upgrade against the Job's immutable template, which is the guard
# against re-running by accident. See README.md.
run: ""

# Where the publisher writes: an oci:// URL to the network's stele
# repository.
repo: ""

# Uploads in flight during a publish. Measured per network against the
# registry it writes to; never lowered to make bursts smaller.
concurrency: ""

# The network's Dolos v2 dolos.toml, carried verbatim into the ConfigMap,
# comments included.
dolosToml: ""

# The epochs whose state the publisher retains a dump of, ascending, each at
# least 1. Echoed into every inscription's parameters as signed input
# (decision 0026), so it is frozen at the network's first publish: additions
# above the then-current tip only. Rendered one per line into the ConfigMap
# and passed as --state-epochs-file. An empty list retains the tip alone; an
# absent one fails the render.
stateEpochs: null

image:
  repository: ghcr.io/txpipe/stelae-publisher
  # Pin to the sha-<short> tag of a known commit — never latest. Each
  # network's values file holds its own pin; there is no chart-wide publisher
  # version.
  tag: ""

# Established repositories fail closed when
# `latest` cannot be restored. Enable this solely for a deliberate first
# publication after independently verifying that the repository is empty.
allowGenesisFallback: false

# The registry runs in-cluster and the write path is plain HTTP, so both the
# restore and the backfill pass --insecure. Turn off only for a TLS registry.
insecure: true

# Secret holding DOLOS_STELAE_REGISTRY_USER and DOLOS_STELAE_REGISTRY_PASSWORD,
# handed to the publisher as DOLOS_STELAE_USER and DOLOS_STELAE_PASSWORD.
# Referenced by name, never templated.
publisherSecretName: stelae-registry-publisher

# Where /data lives. Disabled, it is an emptyDir: every pod restart restores
# all of history from latest. Enabled, it is a PersistentVolumeClaim that
# survives restarts and evictions, so a restarted pod resumes the stores it
# left. A publisher keeps full history, so a network whose history is large
# (mainnet) needs it.
persistence:
  enabled: false
  # Required when the chart creates the claim. A network fact, like resources.
  # Once the claim exists it can only grow, and only while it is Bound on a
  # class with allowVolumeExpansion; anything else fails the upgrade, which
  # still creates the new Job. README.md has the one exception, lowering an
  # unfinished expansion.
  size: ""
  # Empty uses the cluster's default class. Fixed once the claim exists:
  # naming a different class fails the upgrade, as above, and so does
  # clearing a named class back to empty. Naming the default the claim got
  # while empty is no change. Once named, keep naming it.
  storageClassName: ""
  # Mount this claim instead of creating one. The chart never creates or
  # deletes it.
  existingClaim: ""

# Restart budget. On spot capacity an eviction counts here too.
backoffLimit: 200

# Covers the driver's SIGTERM handler finishing its chunk and flushing the
# stores.
terminationGracePeriodSeconds: 600

# Placement. Empty means anywhere the scheduler likes, which is rarely right
# on a tainted cluster.
nodeSelector: {}
tolerations: []

# No default: the working set is a network fact.
resources: {}

# Optional Secret containing direct-s3.json; uploads blobs directly into Zot storage.
directS3SecretName: ""

# Prepared batches: set all three or none. Unset, the run publishes one
# boundary at a time. Set, a sequence appears in the repository only when its
# batch closes, and /data must hold the batch on top of the stores. Both
# sizes follow from the network; README.md has the sizing.
batch:
  # Boundaries in a batch, at least 2. Passed as --batch-epochs.
  epochs: null
  # MiB the batch may hold on disk. Passed as --batch-scratch-mib.
  scratchMib: null
  # MiB kept free per prepared boundary. Passed as --batch-reserve-mib.
  reserveMib: null
