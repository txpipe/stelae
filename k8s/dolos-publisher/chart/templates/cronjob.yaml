{{/*
The scheduled publisher, rendered instead of the Job when a schedule is set.
Each run resumes the kept claim and exits when there is nothing to publish;
Forbid keeps a run from starting beside one still in flight.
*/}}
{{- if .Values.schedule }}
{{- if not .Values.persistence.enabled }}
{{- fail "schedule needs persistence.enabled: every scheduled run on an emptyDir would restore all of history" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dolos-publisher.cronJobName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dolos-publisher.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds | int64 }}
  suspend: {{ .Values.suspend }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit | int64 }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit | int64 }}
  jobTemplate:
    metadata:
      labels:
        {{- include "dolos-publisher.labels" . | nindent 8 }}
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      {{- with .Values.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . | int64 }}
      {{- end }}
      template:
        {{- include "dolos-publisher.podTemplate" (dict "root" . "app" "publisher") | nindent 8 }}
{{- end }}
