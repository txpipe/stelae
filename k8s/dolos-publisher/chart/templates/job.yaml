{{/*
The backfill Job, rendered when no schedule is set. Its name carries the run
counter: a Job's pod template is immutable, so a re-run is a new Job, and
Helm removes the old one in the same upgrade. Everything else about the pod
is a value.
*/}}
{{- if not .Values.schedule }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dolos-publisher.jobName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dolos-publisher.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  template:
    {{- include "dolos-publisher.podTemplate" (dict "root" . "app" "backfill") | nindent 4 }}
{{- end }}
