name: Publisher artifacts

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  BUILDKIT_IMAGE: moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/txpipe/stelae-publisher
  RUST_TOOLCHAIN: 1.93.0
  STELAE_TEST_REGISTRY_IMAGE: public.ecr.aws/docker/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

permissions:
  contents: read

jobs:
  build:
    name: Build publisher (${{ matrix.release_for }})
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_for: Linux-amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - release_for: Linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Build the locked publisher
        run: cargo build --locked --release --package stelae-publisher --target "${{ matrix.target }}"

      - name: Record candidate identity
        env:
          RELEASE_FOR: ${{ matrix.release_for }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir package
          binary="package/stelae-publisher-$RELEASE_FOR"
          cp "target/$TARGET/release/stelae-publisher" "$binary"
          chmod 0755 "$binary"
          (cd package && sha256sum "stelae-publisher-$RELEASE_FOR" >"stelae-publisher-$RELEASE_FOR.sha256")
          binary_sha=$(sha256sum "$binary" | cut -d ' ' -f 1)
          lock_sha=$(sha256sum Cargo.lock | cut -d ' ' -f 1)
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stelae-publisher") | .version')
          created=$(git show --no-patch --format=%cI HEAD)
          jq -n \
            --arg source "https://github.com/$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg created "$created" \
            --arg version "$version" \
            --arg target "$TARGET" \
            --arg runner "$ImageOS/$ImageVersion" \
            --arg rustc "$(rustc --version --verbose)" \
            --arg cargo_lock_sha256 "$lock_sha" \
            --arg binary_sha256 "$binary_sha" \
            '{schema: 1, source: $source, revision: $revision, ref: $ref, created: $created, package: {name: "stelae-publisher", version: $version, target: $target}, builder: {runner: $runner, rustc: $rustc}, inputs: {cargo_lock_sha256: $cargo_lock_sha256}, subject: {sha256: $binary_sha256}}' \
            >"package/stelae-publisher-$RELEASE_FOR.provenance.json"

      - name: Attest release binary provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: package/stelae-publisher-${{ matrix.release_for }}

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stelae-publisher-${{ matrix.release_for }}
          path: package/
          if-no-files-found: error
          retention-days: 14

  chart:
    name: Publisher chart contract
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: k8s/dolos-publisher/test.sh

  image-smoke:
    name: Linux image real-fixture smoke
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Download the Linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stelae-publisher-Linux-amd64
          path: .github/image/bin

      - name: Export the pinned real-boundary stele
        env:
          STELAE_PACKAGING_FIXTURE: ${{ runner.temp }}/stelae-packaging-fixture
        run: cargo test --locked --package stelae-cardano --test publisher_parity export_packaging_smoke_fixture -- --ignored --nocapture

      - name: Build the candidate image
        env:
          STELAE_PACKAGING_FIXTURE: ${{ runner.temp }}/stelae-packaging-fixture
        run: |
          chmod 0755 .github/image/bin/stelae-publisher-Linux-amd64
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stelae-publisher") | .version')
          created=$(git show --no-patch --format=%cI HEAD)
          docker build \
            --platform linux/amd64 \
            --build-arg "BUILD_CREATED=$created" \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --build-arg "BUILD_VERSION=$version" \
            --tag stelae-publisher:image-smoke \
            .github/image
          .github/image/smoke.sh stelae-publisher:image-smoke

  publish-image:
    name: Publish multi-architecture image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, chart, image-smoke]
    runs-on: ubuntu-22.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download both Linux binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stelae-publisher-Linux-*
          path: .github/image/bin
          merge-multiple: true

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish the manifest
        id: image
        run: |
          chmod 0755 .github/image/bin/stelae-publisher-Linux-amd64 .github/image/bin/stelae-publisher-Linux-arm64
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stelae-publisher") | .version')
          test "v$version" = "$GITHUB_REF_NAME"
          created=$(git show --no-patch --format=%cI HEAD)
          short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c 1-7)
          docker buildx create \
            --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" \
            --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "BUILD_CREATED=$created" \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --build-arg "BUILD_VERSION=$version" \
            --metadata-file image-metadata.json \
            --provenance mode=max \
            --push \
            --tag "$IMAGE_NAME:$GITHUB_REF_NAME" \
            --tag "$IMAGE_NAME:sha-$short_sha" \
            .github/image
          digest=$(jq -r '."containerimage.digest"' image-metadata.json)
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, chart, image-smoke, publish-image]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out the release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stelae-publisher-Linux-*
          path: release
          merge-multiple: true

      - name: Publish the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum stelae-publisher-Linux-amd64 stelae-publisher-Linux-arm64 >SHA256SUMS
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            $prerelease \
            stelae-publisher-Linux-amd64 \
            stelae-publisher-Linux-arm64 \
            stelae-publisher-Linux-*.provenance.json \
            SHA256SUMS
