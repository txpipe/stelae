name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    # rustfmt.toml enables `wrap_comments`, an unstable option that only the
    # nightly rustfmt applies — stable silently ignores it. Pinned, because
    # unstable options give no output-stability guarantee; the pin follows the
    # one dolos carries. Local devs: `cargo +nightly-2026-08-27 fmt`.
    env:
      RUSTFMT_NIGHTLY: nightly-2026-08-27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTFMT_NIGHTLY }}
          components: rustfmt
      - run: cargo +$RUSTFMT_NIGHTLY fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Advisories, the C-toolchain refusal, and the extraction boundary: the
  # dolos-crate ban in deny.toml is what makes "the protocol depends on no
  # profile" a resolver check rather than a rule someone keeps.
  deny:
    name: cargo deny (advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  publisher-parity:
    name: Real publisher parity
    runs-on: ubuntu-latest
    env:
      STELAE_PARITY_NEW_REVISION: ${{ github.sha }}
      STELAE_PARITY_REPORT: ${{ github.workspace }}/target/publisher-parity.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p stelae-cardano --test publisher_parity -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-parity-report
          path: target/publisher-parity.json
          if-no-files-found: warn

  registry-parity:
    name: Local OCI fault and restart parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      # These tests deliberately spawn disposable, authenticated registry:2
      # containers. Keeping the ignored selector here makes Docker a visible
      # CI requirement instead of silently treating the registry gate as run.
      - run: cargo test --locked -p stelae --all-features --test oci -- --ignored --nocapture
