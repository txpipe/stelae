# Offline container startup check. No blocks or registry are needed: the host
# initializes from preview's embedded genesis and waits for Mithril until
# SIGTERM. The state epochs file and the unreachable aggregator are passed by
# smoke.sh.
compatibility = "v2-alpha.1"

[chain]
protocol = "cardano"
network = "preview"

[storage]
path = "/data/db"

[history]
mode = "rolling"
window = { unit = "slot", value = 432000 }
