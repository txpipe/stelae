[package]
name = "stelae-cardano"
description = "Cardano publisher integration for Stelae"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stelae = { path = "../stelae", version = "=0.6.0", features = ["oci"] }
stelae-driver = { path = "../stelae-driver", version = "=0.6.0", features = ["oci"] }
# `hardano`: the host exports each closed epoch from its immutable files.
stelae-blocks = { path = "../stelae-blocks", version = "=0.6.0", features = ["hardano"] }

# The Dolos commit whose profile exports the diff chain and names its blocks
# snapshot (txpipe/dolos PR #1610 through PR #1625); see docs/publisher.md.
# DOLOS_REVISION in src/lib.rs names the same commit.
dolos = { git = "https://github.com/txpipe/dolos", rev = "e52f2cf8f7d25870fac712fd85a31b4545c42acf", default-features = false }
dolos-cardano = { git = "https://github.com/txpipe/dolos", rev = "e52f2cf8f7d25870fac712fd85a31b4545c42acf" }
dolos-core = { git = "https://github.com/txpipe/dolos", rev = "e52f2cf8f7d25870fac712fd85a31b4545c42acf" }
dolos-mithril = { git = "https://github.com/txpipe/dolos", rev = "e52f2cf8f7d25870fac712fd85a31b4545c42acf" }
dolos-snapshot = { git = "https://github.com/txpipe/dolos", rev = "e52f2cf8f7d25870fac712fd85a31b4545c42acf" }

itertools = "0.14.0"
pallas = { version = "1.4.0", features = ["hardano", "phase2", "unstable"] }
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.122"
thiserror = "2.0.12"
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.11", features = ["rt"] }
tracing = "0.1.37"

# The `testing` fixture's, which the publisher's binary tests build stores with.
dolos-testing = { git = "https://github.com/txpipe/dolos", rev = "e52f2cf8f7d25870fac712fd85a31b4545c42acf", optional = true }
tempfile = { version = "3.20.0", optional = true }
toml = { version = "0.8.13", optional = true }

[features]
testing = ["dep:dolos-testing", "dep:tempfile", "dep:toml"]

[[example]]
name = "loopback"
required-features = ["testing"]

[dev-dependencies]
stelae-cardano = { path = ".", features = ["testing"] }
dolos-testing = { git = "https://github.com/txpipe/dolos", rev = "e52f2cf8f7d25870fac712fd85a31b4545c42acf" }
dolos-fjall = { git = "https://github.com/txpipe/dolos", rev = "e52f2cf8f7d25870fac712fd85a31b4545c42acf" }
# The tests build fjall errors directly, so this must be the fork revision
# dolos-fjall pins at the Dolos commit above, or two fjall crates would resolve.
fjall = { git = "https://github.com/txpipe/fjall", rev = "ae794ad448d90214c3491df4c50f59f0fe15cf90" }
oci-client = { version = "0.17", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tempfile = "3.20.0"
toml = "0.8.13"
