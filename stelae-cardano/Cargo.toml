[package]
name = "stelae-cardano"
description = "Cardano publisher integration for Stelae"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stelae = { path = "../stelae", version = "=0.5.0", features = ["oci"] }
stelae-driver = { path = "../stelae-driver", version = "=0.5.0", features = ["oci"] }

# The Dolos commit at which the v2 profile is frozen (txpipe/dolos PR #1548);
# DOLOS_REVISION in src/lib.rs names the same commit.
dolos = { git = "https://github.com/txpipe/dolos", rev = "e39a38a31665acb1b5e5701bbb2f8c7cb995cef1", default-features = false }
dolos-cardano = { git = "https://github.com/txpipe/dolos", rev = "e39a38a31665acb1b5e5701bbb2f8c7cb995cef1" }
dolos-core = { git = "https://github.com/txpipe/dolos", rev = "e39a38a31665acb1b5e5701bbb2f8c7cb995cef1" }
dolos-mithril = { git = "https://github.com/txpipe/dolos", rev = "e39a38a31665acb1b5e5701bbb2f8c7cb995cef1" }
dolos-snapshot = { git = "https://github.com/txpipe/dolos", rev = "e39a38a31665acb1b5e5701bbb2f8c7cb995cef1" }

itertools = "0.14.0"
pallas = { version = "1.3.0", features = ["hardano", "phase2", "unstable"] }
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.122"
thiserror = "2.0.12"
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.11", features = ["rt"] }
tracing = "0.1.37"

# The `testing` fixture's, which the publisher's binary tests build stores with.
dolos-testing = { git = "https://github.com/txpipe/dolos", rev = "e39a38a31665acb1b5e5701bbb2f8c7cb995cef1", optional = true }
tempfile = { version = "3.20.0", optional = true }
toml = { version = "0.8.13", optional = true }

[features]
testing = ["dep:dolos-testing", "dep:tempfile", "dep:toml"]

[dev-dependencies]
stelae-cardano = { path = ".", features = ["testing"] }
dolos-testing = { git = "https://github.com/txpipe/dolos", rev = "e39a38a31665acb1b5e5701bbb2f8c7cb995cef1" }
oci-client = { version = "0.17", default-features = false }
tempfile = "3.20.0"
toml = "0.8.13"
