[package]
name = "stelae-cardano"
description = "Cardano publisher integration for Stelae"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stelae = { path = "../stelae", version = "=0.6.0", features = ["oci"] }
stelae-driver = { path = "../stelae-driver", version = "=0.6.0", features = ["oci"] }

# The Dolos commit that builds fjall from the txpipe fork (txpipe/dolos PR
# #1599). Boundary preparation and staged export came earlier (PR #1564), and
# the v2 profile was frozen at e39a38a3 (PR #1548); see docs/publisher.md.
# DOLOS_REVISION in src/lib.rs names the same commit.
dolos = { git = "https://github.com/txpipe/dolos", rev = "a95ecdebe8666ddde29578d7a734af5ce8f16375", default-features = false }
dolos-cardano = { git = "https://github.com/txpipe/dolos", rev = "a95ecdebe8666ddde29578d7a734af5ce8f16375" }
dolos-core = { git = "https://github.com/txpipe/dolos", rev = "a95ecdebe8666ddde29578d7a734af5ce8f16375" }
dolos-mithril = { git = "https://github.com/txpipe/dolos", rev = "a95ecdebe8666ddde29578d7a734af5ce8f16375" }
dolos-snapshot = { git = "https://github.com/txpipe/dolos", rev = "a95ecdebe8666ddde29578d7a734af5ce8f16375" }

itertools = "0.14.0"
pallas = { version = "1.4.0", features = ["hardano", "phase2", "unstable"] }
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.122"
thiserror = "2.0.12"
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.11", features = ["rt"] }
tracing = "0.1.37"

# The `testing` fixture's, which the publisher's binary tests build stores with.
dolos-testing = { git = "https://github.com/txpipe/dolos", rev = "a95ecdebe8666ddde29578d7a734af5ce8f16375", optional = true }
tempfile = { version = "3.20.0", optional = true }
toml = { version = "0.8.13", optional = true }

[features]
testing = ["dep:dolos-testing", "dep:tempfile", "dep:toml"]

[[example]]
name = "loopback"
required-features = ["testing"]

[dev-dependencies]
stelae-cardano = { path = ".", features = ["testing"] }
dolos-testing = { git = "https://github.com/txpipe/dolos", rev = "a95ecdebe8666ddde29578d7a734af5ce8f16375" }
dolos-fjall = { git = "https://github.com/txpipe/dolos", rev = "a95ecdebe8666ddde29578d7a734af5ce8f16375" }
# The tests build fjall errors directly, so this must be the fork revision
# dolos-fjall pins at the Dolos commit above, or two fjall crates would resolve.
fjall = { git = "https://github.com/txpipe/fjall", rev = "ae794ad448d90214c3491df4c50f59f0fe15cf90" }
oci-client = { version = "0.17", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tempfile = "3.20.0"
toml = "0.8.13"
