# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# CI runs `cargo deny check advisories bans`. Licenses/sources are
# intentionally omitted, matching the dolos workspace this repository was
# extracted from.

[graph]
all-features = true
exclude-dev = false

[advisories]
version = 2
yanked = "warn"
unmaintained = "none"
ignore = [
    # "RUSTSEC-0000-0000", # reason — <issue link>
]

[bans]
multiple-versions = "warn"

deny = [
    # Dolos is admitted only below the Cardano integration. These wrappers keep
    # the protocol and generic-driver boundary resolver-enforced: a direct Dolos
    # edge from either crate fails. Names are enumerated because cargo-deny
    # matches exactly; a new dolos-* crate must be added when introduced.
    { crate = "dolos", wrappers = ["stelae-cardano"], reason = "Dolos belongs only below the Cardano integration; the protocol depends on no profile (SPEC.md)" },
    { crate = "dolos-cardano", wrappers = ["stelae-cardano", "dolos", "dolos-snapshot", "dolos-testing"], reason = "Dolos belongs only below the Cardano integration" },
    { crate = "dolos-core", wrappers = ["stelae-cardano", "dolos", "dolos-cardano", "dolos-snapshot", "dolos-mithril", "dolos-fjall", "dolos-redb3", "dolos-testing"], reason = "Dolos belongs only below the Cardano integration" },
    { crate = "dolos-fjall", wrappers = ["dolos", "dolos-testing"], reason = "Dolos belongs only below the Cardano integration" },
    { crate = "dolos-flatfiles", wrappers = ["dolos-fjall"], reason = "Dolos belongs only below the Cardano integration" },
    { crate = "dolos-minibf", reason = "Dolos belongs only below the Cardano integration" },
    { crate = "dolos-minikupo", reason = "Dolos belongs only below the Cardano integration" },
    { crate = "dolos-mithril", wrappers = ["stelae-cardano"], reason = "Dolos belongs only below the Cardano integration" },
    { crate = "dolos-redb3", wrappers = ["dolos", "dolos-testing"], reason = "Dolos belongs only below the Cardano integration" },
    { crate = "dolos-snapshot", wrappers = ["stelae-cardano", "dolos"], reason = "Dolos belongs only below the Cardano integration" },
    { crate = "dolos-testing", wrappers = ["stelae-cardano"], reason = "Dolos belongs only below the Cardano integration" },
    { crate = "dolos-trp", reason = "Dolos belongs only below the Cardano integration" },
    # The same C-toolchain refusal the dolos workspace makes: the oci feature
    # takes reqwest with rustls-no-provider so the crypto provider is the
    # host's choice, and nothing here may drag cmake back in.
    { crate = "cmake", reason = "requires a cmake toolchain; the transport ships no crypto backend of its own (SPEC.md, transport requirements)" },
    { crate = "aws-lc-sys", reason = "pulls cmake in; hosts install ring as the rustls crypto provider (SPEC.md, transport requirements)" },
]
