[package]
name = "stelae-driver"
description = "Profile-generic driver machinery for the Stelae snapshot protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"

[features]
# Forwarded to `stelae/oci` so a driver built for a registry-capable binary and
# the protocol crate under it agree on one feature, rather than each consumer
# having to name both. Nothing here is `#[cfg]`-gated on it yet.
oci = ["stelae/oci"]

# The other half of the Stelae boundary from `stelae` itself: this crate holds
# the lifecycle machinery a publisher or a restorer needs whatever it is
# publishing, and like the protocol crate it depends on no profile. The exact
# pin is the lockstep rule: the two crates release together under one tag,
# so a consumer can never pair a driver with a protocol crate it was not
# released with. See SPEC.md.
[dependencies]
stelae = { path = "../stelae", version = "=0.2.0" }

fs4 = { version = "1.1.0", default-features = false }
minicbor = { version = "0.26", features = ["std"] }
serde = { version = "1.0.136", features = ["derive", "rc"] }
serde_json = "1.0.122"
thiserror = "2.0.12"
tracing = "0.1.37"

[dev-dependencies]
tempfile = "3.20.0"
